<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Read comics, manga, manhua, and manhwa translated swiftly on Clydee."
    />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Clydee" />
    <meta
      property="og:description"
      content="Read comics, manga, manhua, and manhwa translated swiftly on Clydee."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/clydee-logo.png" />
    <title>Clydee</title>
    <style id="vcomics-progress-style">
      #vcomics-navigation-progress {
        position: fixed;
        left: 0;
        right: 0;
        inset-inline-start: 0;
        top: 0;
        z-index: 2147483647;
        width: 100%;
        height: 3px;
        pointer-events: none;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: left center;
        background: #f78745;
        box-shadow: 0 0 16px rgba(247, 135, 69, 0.65);
        transition: transform 180ms cubic-bezier(0.1, 0.7, 0.1, 1), opacity 150ms ease;
      }
      [dir="rtl"] #vcomics-navigation-progress { transform-origin: right center; }
      @media (prefers-reduced-motion: reduce) {
        #vcomics-navigation-progress { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="vcomics-navigation-progress" aria-hidden="true"></div>
    <script>
      (() => {
        const key = "__vcomicsNavigationProgress";
        const w = window;
        if (w[key]?.initialized) return;

        let seqId = 0;
        let activeTimers = [];

        const clearAllTimers = () => {
          for (let i = 0; i < activeTimers.length; i++) {
            clearTimeout(activeTimers[i]);
            clearInterval(activeTimers[i]);
          }
          activeTimers = [];
        };

        const addTimer = (id) => {
          activeTimers.push(id);
          return id;
        };

        const getBar = () => {
          let bar = document.getElementById("vcomics-navigation-progress");
          if (!bar) {
            bar = document.createElement("div");
            bar.id = "vcomics-navigation-progress";
            bar.setAttribute("aria-hidden", "true");
            (document.body || document.documentElement).appendChild(bar);
          }
          return bar;
        };

        const setScale = (ratio, instant) => {
          const bar = getBar();
          if (instant) {
            bar.style.transition = "none";
            bar.style.transform = "scaleX(" + Math.max(0, Math.min(ratio, 1)) + ")";
            void bar.offsetWidth; // Force synchronous reflow
            bar.style.transition = "";
          } else {
            bar.style.transform = "scaleX(" + Math.max(0, Math.min(ratio, 1)) + ")";
          }
        };

        const trigger = () => {
          const currentSeq = ++seqId;
          clearAllTimers();

          const bar = getBar();
          bar.style.opacity = "1";
          setScale(0, true);

          // Step 1: Rapid start to 38%
          window.requestAnimationFrame(() => {
            if (seqId !== currentSeq) return;
            setScale(0.38, false);
          });

          // Step 2: Smooth mid advance to 78%
          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            setScale(0.78, false);
          }, 110));

          // Step 3: Complete to 100%
          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            setScale(1.0, false);
          }, 240));

          // Step 4: Fade out
          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            bar.style.opacity = "0";
          }, 380));

          // Step 5: Reset back to 0
          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            setScale(0, true);
          }, 520));
        };

        const start = () => {
          const currentSeq = ++seqId;
          clearAllTimers();

          const bar = getBar();
          bar.style.opacity = "1";
          setScale(0, true);

          window.requestAnimationFrame(() => {
            if (seqId !== currentSeq) return;
            setScale(0.2, false);
          });

          let val = 0.2;
          const trickle = setInterval(() => {
            if (seqId !== currentSeq) return;
            val += val < 0.7 ? 0.08 : val < 0.88 ? 0.03 : 0.008;
            setScale(Math.min(val, 0.92), false);
          }, 180);
          addTimer(trickle);

          // Guaranteed fail-safe: automatically complete after 1.8s
          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            done();
          }, 1800));
        };

        const done = () => {
          const currentSeq = ++seqId;
          clearAllTimers();

          const bar = getBar();
          setScale(1.0, false);

          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            bar.style.opacity = "0";
          }, 180));

          addTimer(setTimeout(() => {
            if (seqId !== currentSeq) return;
            setScale(0, true);
          }, 360));
        };

        w[key] = {
          initialized: true,
          trigger,
          start,
          done,
        };

        // Start on page refresh
        start();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
